<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' asset: https://asset.localhost; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>MacroHard Design Studio</title>
  <style>
    :root {
      --bg:      #0A1628;
      --surface: #0D1F3C;
      --border:  #1E3A5F;
      --text:    #E8F4FD;
      --dim:     #7BA7CC;
      --accent:  #00D4FF;
      --success: #00C896;
      --warn:    #FF6B35;
      --danger:  #FF3860;
      --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      min-height: 100vh;
    }
    .studio-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .studio-header h1 { font-size: 17px; font-weight: 600; }
    .version { font-size: 11px; color: var(--dim); font-family: var(--mono); }
    .studio-body { display: flex; height: calc(100vh - 50px); overflow: hidden; }
    .audit-panel {
      width: 270px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      background: var(--surface);
    }
    .audit-panel > h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 16px;
    }
    .token-panel { flex: 1; overflow-y: auto; padding: 20px 28px; }
    .token-section { margin-bottom: 28px; }
    .token-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
      margin-bottom: 10px;
    }
    .token-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
    .token-table td, .token-table th {
      padding: 5px 10px;
      border: 1px solid var(--border);
    }
    .token-table th {
      background: var(--surface);
      color: var(--dim);
      font-weight: 500;
      text-align: left;
    }
    .token-table .key { color: var(--accent); }
    .swatch {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .audit-result { padding: 16px; border-radius: 6px; background: rgba(255,255,255,0.04); }
    .audit-score {
      font-size: 36px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1;
      margin-bottom: 6px;
    }
    .audit-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      margin-bottom: 16px;
    }
    .audit-status.pass { background: var(--success); color: #000; }
    .audit-status.warn { background: var(--warn);    color: #000; }
    .audit-status.fail { background: var(--danger);  color: #fff; }
    .loading, .error { padding: 48px; text-align: center; color: var(--dim); font-family: var(--mono); }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <div id="app"><div class="loading">Starting MacroHard Design Studio&#8230;</div></div>
  <script type="module">
    import { mountInspector } from './token-inspector.js';
    mountInspector(document.getElementById('app'));
  </script>
</body>
</html>
