# MH-P12-02: Windows NSIS self-extracting installer build.
#
# build-check   — compiles on windows-latest for every push/PR (fast feedback).
# package       — produces the NSIS .exe artifact on workflow_dispatch or version tags.
#                 Requires @tauri-apps/cli (npm) to invoke `cargo tauri build`.
name: Windows — NSIS Installer

# Auto-trigger (push/pull_request/schedule) disabled 2026-08-09 -- every
# run was failing at the runner-startup stage (ACT-009: org Actions policy
# blocks this org's runners; owner has no access to the settings page that
# would fix it). Real verification/cadence now happens via
# RoadMaps/agents/estate_pipeline.py (proprietary, runs on its own cron,
# no GitHub Actions dependency). Manual workflow_dispatch (and any
# repository_dispatch cross-system triggers below) still work.
on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build-check:
    name: Windows — Rust compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # rolling, pinned 2026-07-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  package:
    name: Windows — NSIS bundle
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # rolling, pinned 2026-07-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      - name: Install npm deps (includes @tauri-apps/cli)
        run: npm install
      - name: cargo tauri build — NSIS
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macroharder-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
