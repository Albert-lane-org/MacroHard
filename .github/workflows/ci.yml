# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-14
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and health check
    runs-on: ubuntu-latest
    steps:
      - name: Runner health check
        run: echo "Runner alive on $RUNNER_OS"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Design tokens validation
        run: |
          if [ -f design-tokens.json ]; then
            python3 -c "
import json, sys
t = json.load(open('design-tokens.json'))
missing = [k for k in ['colors', 'typography', 'spacing'] if k not in t]
if missing:
    print('[FAIL] Missing token categories:', missing)
    sys.exit(1)
print('[OK] design-tokens.json:', list(t.keys()))
"
          else
            echo "No design-tokens.json yet"
          fi
      - name: Audit score smoke test
        run: |
          if [ -f scripts/audit_score.py ]; then
            python3 scripts/audit_score.py
          else
            echo "No audit_score.py yet"
          fi
      - name: TypeScript check
        run: |
          if [ -f tsconfig.json ]; then
            npm install --prefix . typescript 2>/dev/null || true
            npx tsc --noEmit --skipLibCheck || echo "TS warnings (non-blocking Phase 5)"
          else
            echo "No tsconfig.json yet - skipping"
          fi
