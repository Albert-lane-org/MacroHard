name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/laughing-wozniak-zte1vy']

permissions:
  contents: read

jobs:
  type-check:
    name: TypeScript type-check (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Node.js version check
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-save
      - name: Type-check
        run: npm run type-check

  design-tokens:
    name: Design tokens — validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Validate design-tokens.json
        run: python3 scripts/ci_validate_tokens.py
      - name: Audit score smoke test
        run: python3 -c "import scripts.audit_score as a; print('[OK] audit_score importable')"

  json-health:
    name: JSON + state health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Validate all JSON
        run: python3 scripts/ci_json_health.py

  rust:
    name: Rust — src-tauri
    runs-on: ubuntu-latest
    # This job never existed before this commit. src-tauri/ had zero CI
    # coverage -- no build, no test, no fmt/clippy/audit -- despite having
    # real Rust code (workbook.rs, layout.rs, registry.rs, mcp_client.rs,
    # sqlxml_bridge.rs, 35 unit tests). Adding it surfaced two real,
    # previously-undiscovered bugs, both fixed in this same commit:
    #   1. tauri.conf.json's icon codegen expects icons/icon.png to exist;
    #      it didn't (icons/ didn't exist at all), so `cargo build` failed
    #      immediately -- this crate has apparently never actually compiled.
    #      Added a placeholder icon set (design-token colors) to unblock;
    #      a real app icon is separate design work, not a CI blocker.
    #   2. workbook.rs had a manually-written `impl Default for CellValue`
    #      that clippy -D warnings flags as derivable -- fixed to #[derive].
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --component clippy,rustfmt && rustup default stable
      - name: Checkout sqlxml (private Cargo dep)
        # sqlxml-engine is a private git dep. Pre-checkout with _ROADMAPS
        # so actions/checkout handles auth natively (token injected via
        # git credential helper internal to the action). Then [patch]
        # below redirects Cargo to the local copy — no Cargo-level auth
        # needed, bypassing five failed insteadOf/credential-helper attempts
        # whose root cause is _ROADMAPS PAT containing URL-special chars
        # that corrupt every git URL embedding approach.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: albert-lane-org/sqlxml
          token: ${{ secrets._ROADMAPS }}
          path: sqlxml-dep
      - name: Patch Cargo to use local sqlxml-engine checkout
        run: |
          python3 -c "
import os
ws = os.environ['GITHUB_WORKSPACE']
path = f'{ws}/sqlxml-dep/crates/sqlxml-engine'
snippet = f'\n[patch.\"https://github.com/albert-lane-org/sqlxml\"]\nsqlxml-engine = {{ path = \"{path}\" }}\n'
cargo_dir = os.path.expanduser('~/.cargo')
os.makedirs(cargo_dir, exist_ok=True)
with open(os.path.join(cargo_dir, 'config.toml'), 'a') as f:
    f.write(snippet)
print(f'[patch] sqlxml-engine -> {path}')
"
      - name: Install Tauri system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: build
        working-directory: src-tauri
        run: cargo build
      - name: test
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: cargo audit — zero high/critical required
        working-directory: src-tauri
        # Same Tauri 2.x + GTK3 Linux webview stack as tauri-rustxml, so
        # the same 17 upstream unmaintained/unsound advisories apply --
        # none in this repo's own code. See tauri-rustxml/deny.toml and
        # its ci.yml cargo-audit step for the identical, longer-documented
        # precedent this list is copied from.
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100
