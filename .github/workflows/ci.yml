# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-28
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/laughing-wozniak-zte1vy']

permissions:
  contents: read

jobs:
  type-check:
    name: TypeScript type-check (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Node.js version check
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-save
      - name: Type-check
        run: npm run type-check

  design-tokens:
    name: Design tokens — validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - name: Validate design-tokens.json
        run: python3 scripts/ci_validate_tokens.py
      - name: Audit score smoke test
        run: python3 -c "import scripts.audit_score as a; print('[OK] audit_score importable')"

  json-health:
    name: JSON + state health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Validate all JSON
        run: python3 scripts/ci_json_health.py
