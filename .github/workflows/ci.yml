# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-12
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main, 'claude/laughing-wozniak-zte1vy']

permissions:
  contents: read

jobs:
  design-tokens:
    name: Design tokens — validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate design-tokens.json
        run: python3 scripts/ci_validate_tokens.py
      - name: Audit score smoke test
        run: python3 -c "import scripts.audit_score as a; print('[OK] audit_score importable')"

  json-health:
    name: JSON + state health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate all JSON
        run: python3 scripts/ci_json_health.py
