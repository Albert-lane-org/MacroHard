# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-14
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    name: Lint and health check
    runs-on: ubuntu-latest
    steps:
      - name: Runner health check
        run: echo "Runner alive on $RUNNER_OS"
      - name: Checkout (action-free)
        env:
          ROADMAPS_TOKEN: ${{ secrets._ROADMAPS }}
        run: |
          echo "::add-mask::$ROADMAPS_TOKEN"
          git init -q .
          git remote add origin "https://x-access-token:${ROADMAPS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Node version
        run: node --version && npm --version
      - name: TypeScript check
        run: |
          if [ -f tsconfig.json ]; then
            npm install --prefix . typescript 2>/dev/null || true
            npx tsc --noEmit --skipLibCheck || echo "TS warnings (non-blocking Phase 5)"
          else
            echo "No tsconfig.json yet - skipping"
          fi
      - name: Design tokens validation
        run: |
          if [ -f design-tokens.json ]; then
            python3 -c "import json; json.load(open('design-tokens.json')); print('design-tokens.json valid JSON')"
          else
            echo "No design-tokens.json yet"
          fi
      - name: Audit score stub check
        run: |
          if [ -f scripts/audit_score.py ]; then
            python3 scripts/audit_score.py --help || python3 -c "import ast; ast.parse(open('scripts/audit_score.py').read()); print('audit_score.py syntax OK')"
          else
            echo "No audit_score.py yet"
          fi
