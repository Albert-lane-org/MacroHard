# MacroHard — Deploy to Cloudflare Workers on push to main

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets._Agent_Key }}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check before deploy
        run: npm run type-check

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets._Agent_Key }}
        run: npm run deploy
