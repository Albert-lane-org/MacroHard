# MacroHard — Deploy to Cloudflare Workers on push to main

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets._Agent_Key }}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check before deploy
        run: npm run type-check

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets._Agent_Key }}
        run: npm run deploy
