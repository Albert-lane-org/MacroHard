# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-28
# MacroHarder Design Studio — Tauri 2.0 shell (MH-P6-01; renamed MH-P6-04)
[package]
name    = "macroharder-studio"
version = "0.1.0"
edition = "2021"

[lib]
name       = "macroharder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri      = { version = "2.11.5", features = ["devtools"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "2"
# MH-P8-02/03: MCP HTTP client for procurement/maps module Workers.
# rustls (not native-tls) so this doesn't pull in an OpenSSL/pkg-config
# system dependency on top of Tauri's existing GTK/WebKit requirement.
# reqwest 0.13 renamed the "rustls-tls" meta-feature to "rustls" + an
# explicit root-store choice; "webpki-roots" preserves the old bundled-CA
# behaviour ("rustls-tls" was documented as rustls + webpki-roots in 0.12).
reqwest    = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

# MH-P12-01: BLAKE3 content-hash manifest verified on boot.
blake3     = "1"

# MH-P7-03: sqlxml-engine live wire. MH-AB-001 fully resolved -- sqlxml
# PR #15 (crates/sqlxml-engine restructured into a real library crate)
# merged to main 2026-07-09. Re-pinned off the feature branch.
sqlxml-engine = { git = "https://github.com/albert-lane-org/sqlxml", branch = "main", package = "sqlxml-engine", optional = true }

[features]
sqlxml = ["dep:sqlxml-engine"]

# CI shim: redirect the private git dep to a local stub so Cargo never
# needs to authenticate with albert-lane-org/sqlxml to resolve the lockfile.
# The sqlxml feature is not enabled in CI (no --features sqlxml), so this
# stub is resolution-only — its code is never compiled during CI.
# Remove this [patch] for production builds with --features sqlxml and
# real network auth to albert-lane-org/sqlxml.
[patch."https://github.com/albert-lane-org/sqlxml"]
sqlxml-engine = { path = "crates/sqlxml-engine-stub" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# MH-P13-01: C/C++ compute kernels FFI — matrix3d.c + kriging.c
cc = "1"

[profile.release]
lto           = true
opt-level     = "z"
codegen-units = 1
strip         = true

[profile.dev]
incremental = true
