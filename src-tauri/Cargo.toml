# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-28
# MacroHard Design Studio — Tauri 2.0 shell (MH-P6-01)
[package]
name    = "macrohard-studio"
version = "0.1.0"
edition = "2021"

[lib]
name       = "macrohard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri      = { version = "2.0.0-rc", features = ["devtools"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1"

# MH-P6-02: sqlxml-engine git dependency — deferred to Phase 7.
# Activation requires sqlxml backend-agent to be restructured as a
# Cargo library crate (currently a binary stdin-pipe agent).
# sqlxml-engine = { git = "https://github.com/albert-lane-org/sqlxml", optional = true }

[features]
# sqlxml = ["dep:sqlxml-engine"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[profile.release]
lto           = true
opt-level     = "z"
codegen-units = 1
strip         = true

[profile.dev]
incremental = true
