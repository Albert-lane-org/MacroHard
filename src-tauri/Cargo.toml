# Authored: Albert Lane | Documented: Claude Sonnet 4.6 | 2026-06-28
# MacroHarder Design Studio — Tauri 2.0 shell (MH-P6-01; renamed MH-P6-04)
[package]
name    = "macroharder-studio"
version = "0.1.0"
edition = "2021"

[lib]
name       = "macroharder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri      = { version = "2.0.0-rc", features = ["devtools"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1"

# MH-P8-02/03: MCP HTTP client for procurement/maps module Workers.
# rustls (not native-tls) so this doesn't pull in an OpenSSL/pkg-config
# system dependency on top of Tauri's existing GTK/WebKit requirement.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# MH-P7-03: sqlxml-engine live wire. MH-AB-001 fully resolved -- sqlxml
# PR #15 (crates/sqlxml-engine restructured into a real library crate)
# merged to main 2026-07-09. Re-pinned off the feature branch.
sqlxml-engine = { git = "https://github.com/albert-lane-org/sqlxml", branch = "main", package = "sqlxml-engine", optional = true }

[features]
sqlxml = ["dep:sqlxml-engine"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[profile.release]
lto           = true
opt-level     = "z"
codegen-units = 1
strip         = true

[profile.dev]
incremental = true
