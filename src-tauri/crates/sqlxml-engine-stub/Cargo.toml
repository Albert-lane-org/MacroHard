# CI stub that satisfies sqlxml-engine's package name so Cargo never needs
# to authenticate with albert-lane-org/sqlxml to resolve the lockfile.
# The [patch] in src-tauri/Cargo.toml redirects there.
# Optional dep is never compiled in CI (no --features sqlxml), so lib.rs
# content is irrelevant for builds; stub exists purely for lock resolution.
[package]
name        = "sqlxml-engine"
version     = "0.1.0"
edition     = "2021"
publish     = false
description = "CI stub — not for production use. Remove [patch] in src-tauri/Cargo.toml to use the real crate."
